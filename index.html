<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Chess Bot</title>
        
        <link rel="stylesheet" href="./chessboardjs-1.0.0/css/chessboard-1.0.0.min.css">
        <link rel="stylesheet" href="./style.css">
        <script src="./node_modules/jquery/dist/jquery.min.js"></script>
        <script src="./chess.min.js"></script>
        <script src="./chessboardjs-1.0.0/js/chessboard-1.0.0.min.js"></script>
        
    </head>

    <body>

        <header class="site-header">
            <h1>Chess Bot</h1>
        </header>
        
        <main class="main-container">
            <div id="board1" class="chessboard-wrapper"></div>


            <div class=sidebar>
                <div id="game-info" class="card">
                    <h2 id="eval" class="eval-text">0.0</h2>


                    <h3>Game Status</h3>
                    <div id="status" class="status-text"></div>

                    <div class="data-group">
                        <span class="label">FEN:</span>
                        <div id="fen" class="code-text"></div>
                    </div>
                    
                    <div class="data-group">
                        <span class="label">PGN:</span>
                        <div id="pgn" class="code-text"></div>

                </div>
            </div>
            <div class="button-group">
                <button id="start-button" class="btn btn-primary" onclick="location.reload()">New Game</button>
                <button id="reset-button" class="btn btn-secondary" onclick="alert('working on functionality')">Reset Board</button>
            </div>
        </main>

        <script src="script.js"></script>

        <style>
            body {
                background-color: rgba(165, 229, 255, 0.202);
            }
        </style>
    </body>
</html>
